[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admeasy-desktop"
version = "0.1.0"
description = "Admeasy desktop companion: your phone controls this Mac/PC via the Admeasy backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13,<16",
  "httpx>=0.27,<1",
  "playwright>=1.47,<2",
  "mss>=9.0,<10",
  "pyautogui>=0.9.54,<1",
  "pillow>=10.0,<12",
  "pyperclip>=1.9,<2",
  "keyring>=25,<26",
  "pywebview>=5.0,<6",
  "pystray>=0.19,<1",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-Quartz>=10,<12",
  "pyobjc-framework-ApplicationServices>=10,<12",
  "pyobjc-framework-Cocoa>=10,<12",
]
build = ["pyinstaller>=6.6,<7"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
admeasy-desktop = "admeasy_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["admeasy_desktop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
